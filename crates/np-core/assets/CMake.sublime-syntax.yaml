  - comment: Compiler Flags
    match: \b(?:(cmake_)?(cxx_flags|cmake_cxx_flags_debug|cmake_cxx_flags_minsizerel|cmake_cxx_flags_release|cmake_cxx_flags_relwithdebinfo))\b
